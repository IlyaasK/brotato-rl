[base]
env_name = brotato
eval_episodes = 32
eval_agents = 32

[env]
zone = 0
shop_steps = 1
; Profile selector: canonical character token and the explicit starting weapon.
; "bull" is the default zero-slot weaponless profile; "knight"/"demon" are the
; source character profiles (training them is a later task). The weapon token is
; any canonical weapon name (see brotato_weapons.h); "none" means no weapon.
character = bull
starting_weapon = none

; Endless mode (run_data.gd:196-197 is_endless_run / the run-options toggle):
; 1 = the run continues past the wave-20 clear instead of ending (the core then
; applies the endless enemy hp/dmg/speed scaling, shop/reroll inflation, iframe
; reduction, loot decay and the wave-10k elite reschedule). Read with dict_find,
; so this key is optional; 0 (default) is the normal campaign.
endless = 0

; DebugService.invulnerable (run_data.gd:556 -> player.gd:114-115
; disable_hurtbox): 1 disables the player's Hurtbox, so no enemy contact or
; projectile registers a hit on the player (no iframes/dodge draws/damage), while
; enemy AI/RNG/spawns are unchanged.  0 (default) is the normal player.  Like
; start_wave/audio_rng this is an OPTIONAL [env] key and the trainer only accepts
; a `--env.invulnerable=` override when the key is present in the loaded config,
; which is why it is declared here.
invulnerable = 0

; The real game does not score a run by kills: a run's persistent record is
; ProgressData's DifficultyScore (difficulty_value + wave_number, run_data.gd
; :1819 / main.gd:944), i.e. "which wave did you reach at which danger".
; The bridge reads the same quantity (mod_main.gd reports RunData.current_wave).
; So the objective metric is the env's `perf`, which bt_core_add_log sets to the
; wave reached (1..20 in the campaign, >20 in endless). `score` is only a
; secondary stat: it stays the episode kill count, which is what the game's run
; summary shows but NOT its progress record. default.ini's [sweep]
; metric = score would therefore rank/segregate training runs by kills
; (kill-farming at low waves beats a Danger-5 clear of fewer enemies), so
; override it here. PufferLib convention is likewise `metric = perf`
; (see admiral.ini / bat.ini / cartpole.ini).
[sweep]
metric = perf

[vec]
total_agents = 128
num_buffers = 1

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 200_000_000
gamma = 0.99
learning_rate = 0.001
minibatch_size = 8192
horizon = 64
ent_coef = 0.02
