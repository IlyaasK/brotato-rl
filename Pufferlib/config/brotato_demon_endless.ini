; =============================================================================
; Brotato: DEMON, Danger 5, ENDLESS (wave 21+) -- the primary training target.
;
; Strategy: ArosRising's "Guide to Endless Mode" (High Endless section).
;   start Ghost Scepter -> keep ~1 HP early and abuse the HP shop -> combine
;   scepters -> buy economy (Harvesting, Luck, Bag, Crown, Hunting Trophy,
;   Coupon, Dangerous Bunny, Recycling Machine, Lure) -> pivot around wave
;   25-40 to Pruner / Potato Thrower / Excalibur (+ Alien Eyes, Anvil) -> Spicy
;   Sauce build (Garden + Improved Tools, Explosive Shells + Plastic Explosive,
;   Alien Tongue, Sad Tomato/Torture, Padding, Tardigrade, Silver Bullet,
;   Grind's Magical Leaf, Vigilante Ring, Bloody Hand) -> lock the shop and
;   bank materials late.  Demon converts 50% of its gold into +1 Max HP per
;   13-gold chunk at every wave end (brotato_character_runtime.h
;   bt_character_convert_end_of_wave), and its SHOP CURRENCY is Max HP, not
;   gold (run_data.gd:1428-1439), so materials are Max HP one wave later.
;
; This file is a SEPARATE config from config/brotato.ini (which stays the
; campaign Bull profile) so both remain runnable:
;     ./build.sh brotato build/brotato_cpu_train
;     ./build/BROTATO-IF-APPLICABLE ... --base...    (see below)
; The trainer loads config/default.ini, then config/<env_name>.ini: env_name is
; "brotato", so to use THIS file copy it over config/brotato.ini, or pass the
; keys below on the command line as --section.key=value.
; =============================================================================

[base]
env_name = brotato
eval_episodes = 16
eval_agents = 64

[env]
zone = 0
shop_steps = 1
; Demon profile + the guide's starting weapon. The weapon token is the
; canonical BT_WEAPONS id stem (brotato_weapons.h); "weapon_ghost_scepter"
; resolves to the tier-1 Ghost Scepter row (bt_weapon_index_from_id matches
; my_id first, then id, so the group token lands on the lowest tier).
character = demon
starting_weapon = weapon_ghost_scepter
; Continue beyond wave 20; perf reports the wave reached.
endless = 1
; Match the evaluation bridge's suppressed sound queues/picks.
audio_rng = 0
; All CPUParticles2D emitters are also suppressed by the evaluation bridge.
particles_rng = 0
; DebugService.invulnerable (run_data.gd:556): 1 disables the player's Hurtbox,
; so no enemy contact/projectile registers a hit on the player (no
; iframes/dodge draws/damage), while enemy AI/RNG/spawns are unchanged.  This is
; the instrument that makes a DEEP start_wave run survive a sustained crowd
; (a fresh wave-40 Demon otherwise dies ~250 ticks into every episode); 0
; (default) is the normal player.  Declared here (an OPTIONAL [env] key) so the
; trainer accepts a --env.invulnerable= override, like start_wave/audio_rng.
invulnerable = 0

; --- reward shaping: potential-based, F = gamma*Phi(s') - Phi(s) ------------
; Phi is a linear map over the progress groups below (brotato_reward.h). Every
; weight defaults to 0; with all of them 0 the shaping term is exactly 0.0f and
; the reward stream is bit-identical to the unshaped game, so these values are
; independent knobs, not a redefinition of the task. Per-episode totals are
; exported as env/rw_total and env/rw_<group>, and env/perf is the wave
; reached (Log.perf).
; rw_gamma MUST equal [train] gamma: the Ng et al. invariance holds for the
; gamma the learner optimises, not for an arbitrary constant.
rw_gamma = 0.999
; sqrt(max_hp): Demon's defence and its shop currency. (sqrt, not log: both are
; concave, but sqrt is IEEE-correctly-rounded on host and device -- bt_sqrtf ==
; __fsqrt_rn -- while device logf is not bit-identical to glibc's, which would
; break CPU/CUDA/Metal reward parity.)
; TENSION to tune, not a bug: under hp_shop every purchase REMOVES max HP, so a
; large rw_hp pays the agent for NOT shopping, while the guide's early game is
; "keep ~1 HP and abuse the HP shop". Keep rw_hp small (0.25-0.75) so it
; measures the guide's mid/late-game Max HP engine without fighting the shop.
; Policy invariance still holds for any value (Ng et al. 1999).
rw_hp = 0.5
rw_harvest = 0.5
rw_luck = 0.5
; Banked materials. 0 for Demon ON PURPOSE: gold's only use here is Demon's
; end-of-wave conversion into Max HP (50% of gold, +1 max HP per 13-gold chunk,
; brotato_character_runtime.h bt_character_convert_end_of_wave), which rw_hp
; already pays at the SAME transition. A linear materials term would double
; count it and, because it is linear while sqrt(max_hp) is concave, would swamp
; the hp credit (e.g. 8 chunks = -65 gold = -3.25 shaping at 0.05 vs +1.0 hp
; credit at 2.0) and so PUNISH the very conversion the guide farms. Set a small
; nonzero value (e.g. 0.005) only if you also raise rw_hp enough that the
; conversion stays net positive.
rw_materials = 0.0
rw_late_wave = 20
; Fallback weight for every counted item in brotato_reward.h's BT_RW_ITEM_IDX
; (Padding, Spicy Sauce, Garden, Improved Tools, Explosive Shells, Plastic
; Explosive, Alien Tongue, Hunting Trophy, Tardigrade, Anvil, Alien Eyes,
; Vigilante Ring, Grind's Magical Leaf, Silver Bullet, Bag, Recycling Machine).
; An individual rw_item_<stem> key OVERRIDES this fallback for that item, e.g.
;   rw_item_padding = 2.0
rw_items = 0.5
; Owned Pruner / Potato Thrower / Excalibur, credit (tier + 1) per copy.
rw_pivot = 1.0
rw_pivot_1 = weapon_pruner
rw_pivot_2 = weapon_potato_thrower
rw_pivot_3 = weapon_excalibur
; NOT potential-based (it changes the incentive): 0 = off, R_WAVE * (1 +
; rw_wave_scale * max(0, wave-20)/10) per cleared wave. 1.0 makes wave 30 pay
; 16 instead of 8. Only enable once the endless loop ships.
rw_wave_scale = 0

; Sweep/best-checkpoint objective = env/perf = wave reached (this is the
; game's own record: max_endless_wave_beaten.set_info(..., current_wave, ...),
; main.gd:944). default.ini's `metric = score` would rank runs by KILLS.
[sweep]
metric = perf

[vec]
; CPU/env-side sizing. The CUDA env allocates exactly n * sizeof(Env)
; (brotato.cu:184) and StateCompact is still landing cuts, so SIZE-CHECK BEFORE
; EVERY RUN -- `build/brotato_state_size sizes` -- instead of trusting a quoted
; figure: it has been 1.167 -> 1.505 -> 1.416 MiB/agent in one night (now
; 1,484,784 B). At 1.416 MiB, 8192 agents is ~11.6 GB of STATE ALONE, i.e. OOM
; once the trainer's ~0.7-1.3 GB of buffers + CUDA graphs are added; the safe top
; of the range today is ~6144 agents (8.7 GB state + buffers). A valid example at
; the current size: --vec.total_agents=6144 --train.horizon=128 \
; --train.minibatch_size=32768 (6144 % 256 == 0, 32768 <= 128*6144, and
; 32768 % 128 == 0).
; GPU runs (PerfTrainer, RTX 5070, Demon + Ghost Scepter, bf16; full itemised
; write-up build/trainer_sps_findings.md, tables build/bench_trainer_report.md).
; Steady-state SPS, median over interior dashboard frames (a run's final frame is
; short and reads up to 2x high -- never quote lifetime/final-window numbers):
;   PRE-THIS-EVENING build (00:23): 2048 ag h64 mb8192 0.94M / 3.5G; 4096 1.60M /
;     5.7G (2.56 ms/tick); 4864 1.70M / 6.6G; 5632 1.80M / 7.5G; 8192 2.00M /
;     10.5G; 4096 h128 mb32768 1.60M.
;   CURRENT TREE (01:21, identical argv): 4096 agents 0.655M / 6.25 ms per tick /
;     7.0G -- a 3.4x regression from the in-flight env-step refactor of which
;     only part is state growth; reported to Main/PerfGpuKernel. Quote 0.655M,
;     not 1.60M, until that is fixed.
; Regime facts: the env tick GROWS with agent count so SPS is flat in a narrow
; band and the ceiling is DRAM bandwidth (ncU counters are denied on this host, so
; traffic is inferred from time x bandwidth); >5M needs <=~134 KB of traffic per
; env-tick or more threads per env -- config alone cannot get there, and the
; trainer is not the limit (trainer-only ceiling >5M with a small MLP).
; DEPTH: the start_wave rows (mine included) are RESET-DOMINATED, not deep play --
; a fresh start_wave 25/40 Demon has 10 hp and no items, so it dies to first
; contact ~250 ticks into every episode. Those rows therefore measure "spawn
; density at wave N + one reset per ~250 ticks", and "depth does not change
; throughput" from them is NOT evidence about sustained crowds. The valid
; sustained-crowd instruments are (a) the probe's DEEP mode (1e9 hp, invulnerable)
; -- capacity residuals 1.44x pre-fix / 1.12x post-fix at wave 60 vs 1.57x /
; 1.20x shallow, i.e. capacity cost is density-insensitive in a state that
; survives -- and (b) trainer runs with `[env] invulnerable = 1` (declared above;
; bench-only, mirrors player.gd disable_hurtbox with enemy AI/RNG/spawns
; unchanged; CPU-verified at start_wave 40: 20k ticks at a peak of 168 live
; enemies and 83 projectiles with bt_capacity_mask() == 0). Never enable it for
; TRAINING runs: with it on the hit/dodge/damage terms of the reward are inert,
; so it measures throughput, not the task. NOTE the flag's CUDA/Metal paths are
; preflight-only so far (no CUDA compile run), so verify before quoting GPU
; numbers from it.
; Recommended: total_agents 4096-6144, sized against the live sizeof(BtState);
; horizon 64-128 (256-512 is free for GAE with gamma 0.999 since throughput is
; horizon-neutral); minibatch_size 8192-32768; replay_ratio 1.0; bf16 (fp32 is
; 2.2-2.8x slower); async 1; cudagraphs 1 (use -1 at the very top of the agent
; range -- a long 8192-agent run died instantiating the second async slot's train
; graph); num_buffers 1. Hard asserts: minibatch_size % horizon == 0;
; minibatch_size <= horizon*total_agents; total_agents % (minibatch_size/horizon)
; == 0; horizon % 8 == 0 for bf16. [env] keys start_wave / warp_step / audio_rng
; are REJECTED on the CLI ("missing key [env] ...") so they must be in the loaded
; config, hence the private-cwd recipes (tools/bench_trainer_make_deep_cwds.sh).
; CPU trainer default below: 256 agents ~= 0.92 GB fixed + ~0.3 GB state.
total_agents = 256
num_buffers = 1
num_threads = 16

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 200_000_000
; Endless waves are long (60 s from wave 9, 90 s at 20) and the objective sits
; thousands of ticks away: 0.99 makes every wave/win term vanish (0.99^1200 ~
; 5e-6). 1/(1-0.999) = 1000 ticks ~ 17 s of game time.
gamma = 0.999
gae_lambda = 0.95
learning_rate = 0.001
; 256 agents x 128 = 32768 transitions per epoch; 8192 = 4 minibatches/epoch
; (replay_ratio 1). minibatch_size must stay a multiple of horizon, and
; minibatch_size/horizon (64 segments) must not exceed total_agents.
horizon = 128
minibatch_size = 8192
ent_coef = 0.02
